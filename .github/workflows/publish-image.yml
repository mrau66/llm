name: Build and publish knowledge image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check publication repository
        if: github.repository != 'mrau66/llm'
        run: |
          echo 'This publication workflow is configured for mrau66/llm.'
          exit 1

      - name: Refuse to overwrite a public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_private_package.py --allow-missing

      - name: Test archive and integration logic
        run: python3 -m unittest discover -s tests -v

      - name: Build and check the real image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/personal-knowledge"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Local Obsidian archive and retrieval tools for ZeroClaw" \
            --tag "$image:latest" --tag "$image:sha-${GITHUB_SHA}" .
          docker network create knowledge-ci
          docker run -d --name knowledge --network knowledge-ci \
            -e DATA_PATH=/tmp/knowledge-data -e VAULT_PATH=/tmp/knowledge-vault \
            "$image:sha-${GITHUB_SHA}"
          if ! docker exec knowledge python smoke_mcp.py; then
            docker logs knowledge
            exit 1
          fi
          docker rm -f knowledge
          docker network rm knowledge-ci

      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/personal-knowledge"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
          echo "Published $image:latest and $image:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify package remains private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_private_package.py
